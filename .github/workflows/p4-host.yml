name: Native layout source and host contracts
on:
  push:
    branches: [refactor/native-layout]
  pull_request:
    branches: [refactor/native-layout]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: LMCache
    steps:
      - uses: actions/checkout@v4
        with:
          path: LMCache
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: zhangzhaoju/vllm-dual
          ref: refactor/native-layout
          path: vllm
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Host-only dependencies (no torch or CANN)
        run: python -m pip install pytest==9.0.2 numpy==1.26.4 msgspec==0.20.0 pyzmq==27.1.0 pydantic==2.12.5 setuptools==79.0.1 sphinx==7.2.6
      - run: python -B tools/run_layout_host_checks.py
      - run: sphinx-build -E -W --keep-going -b html docs/source /tmp/native-layout-docs
